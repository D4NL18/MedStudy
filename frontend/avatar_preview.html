      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    h1 {

      font-size: 20px;
      color: #38bdf8;
    }
    .grid {

      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      background: #0d9488;
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 9999px;
      letter-spacing: 0.3px;
    }
    .subtitle {
      font-size: 11px;
      color: #64748b;
      margin-top: -6px;
